<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM Sampler Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-darkest: #0d0d0f;
            --bg-dark: #141416;
            --bg-mid: #1a1a1e;
            --bg-light: #222226;
            --bg-lighter: #2a2a30;
            --border: #333338;
            --border-light: #404048;
            --text-bright: #ffffff;
            --text-primary: #e0e0e0;
            --text-secondary: #888890;
            --text-dim: #555560;
            --accent: #e84a35;
            --accent-dim: #c43d2a;
            --accent-glow: rgba(232, 74, 53, 0.4);
            --cyan: #00c8e0;
            --cyan-dim: #008fa0;
            --green: #00c853;
            --yellow: #ffc107;
            --purple: #9c5fff;
            --orange: #ff9800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg-darkest);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .sampler-container {
            display: flex;
            gap: 0;
            max-width: 1200px;
        }

        .sampler {
            background: var(--bg-dark);
            border-radius: 8px 0 0 8px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid var(--border);
            border-right: none;
        }

        /* Piano Roll */
        .piano-roll {
            background: var(--bg-mid);
            border: 1px solid var(--border);
            border-radius: 0 8px 8px 0;
            display: flex;
            flex-direction: column;
            width: 70px;
            overflow: hidden;
        }

        .piano-roll-header {
            padding: 8px 6px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .piano-roll-title {
            font-size: 9px;
            font-weight: 600;
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .piano-roll-keys {
            flex: 1;
            display: flex;
            flex-direction: column-reverse;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg-darkest);
        }

        .piano-roll-keys::-webkit-scrollbar { width: 4px; }
        .piano-roll-keys::-webkit-scrollbar-track { background: var(--bg-darkest); }
        .piano-roll-keys::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .piano-key {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.05s;
            user-select: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .piano-key.white {
            height: 18px;
            background: linear-gradient(90deg, #f8f8f8 0%, #e8e8e8 70%, #d0d0d0 100%);
            z-index: 1;
        }

        .piano-key.black {
            height: 14px;
            background: linear-gradient(90deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
            width: 70%;
            z-index: 2;
            margin-top: -7px;
            margin-bottom: -7px;
            border-radius: 0 3px 3px 0;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .piano-key.white:hover { background: linear-gradient(90deg, #fff 0%, #f0f0f0 70%, #e0e0e0 100%); }
        .piano-key.black:hover { background: linear-gradient(90deg, #2a2a2a 0%, #3a3a3a 50%, #2a2a2a 100%); }
        .piano-key.white.active, .piano-key.white.playing { background: linear-gradient(90deg, var(--cyan) 0%, #00a8c0 70%, #0090a0 100%); }
        .piano-key.black.active, .piano-key.black.playing { background: linear-gradient(90deg, var(--cyan-dim) 0%, var(--cyan) 50%, var(--cyan-dim) 100%); box-shadow: 0 0 10px var(--cyan); }

        .piano-key.white.has-slice::before {
            content: '';
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background: var(--purple);
            border-radius: 50%;
        }

        .piano-key.black.has-slice::before {
            content: '';
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 5px;
            background: var(--purple);
            border-radius: 50%;
        }

        .piano-key-label {
            position: absolute;
            left: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            font-weight: 600;
            pointer-events: none;
        }

        .piano-key.white .piano-key-label { color: var(--text-dim); }
        .piano-key.black .piano-key-label { color: #666; }
        .piano-key.white.c-note .piano-key-label { color: var(--accent); font-weight: 700; }
        .piano-key.white.c-note { border-bottom: 2px solid var(--accent-dim); }

        .piano-key-slice-num {
            position: absolute;
            right: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 7px;
            font-weight: 600;
            color: var(--purple);
            pointer-events: none;
        }

        .piano-key.black .piano-key-slice-num { right: 8px; }

        .piano-roll-footer {
            padding: 6px;
            background: var(--bg-dark);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .piano-roll-info {
            font-size: 8px;
            color: var(--text-dim);
            text-align: center;
        }

        .piano-roll-info.active { color: var(--cyan); }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--bg-mid);
            border-bottom: 1px solid var(--border);
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-icon svg { width: 16px; height: 16px; fill: white; }
        .logo-text { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; color: var(--text-bright); }

        .header-center { display: flex; align-items: center; gap: 16px; }
        .sync-badge {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-light); padding: 5px 10px; border-radius: 4px;
            font-size: 11px; font-weight: 500; color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .sync-badge.active { color: var(--cyan); border-color: var(--cyan-dim); }
        .tempo-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px; font-weight: 500; color: var(--text-bright);
            background: var(--bg-darkest); padding: 5px 12px; border-radius: 4px;
            border: 1px solid var(--border);
        }

        .header-right { display: flex; align-items: center; gap: 8px; }
        .midi-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
        .midi-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); transition: all 0.15s; }
        .midi-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .midi-dot.active { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
        .pad-counter { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary); }

        .main-content { display: flex; flex-direction: column; }

        .pad-section { padding: 16px; background: var(--bg-dark); }
        .pad-grid-wrapper { display: flex; gap: 8px; }
        .pad-row-indicators { display: flex; flex-direction: column; gap: 6px; }
        .row-indicator {
            width: 24px; flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; color: var(--text-dim);
            background: var(--bg-mid); border-radius: 4px;
        }
        .pad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }

        .pad {
            height: 68px;
            background: linear-gradient(180deg, var(--bg-lighter) 0%, var(--bg-light) 100%);
            border-radius: 4px; cursor: pointer; position: relative;
            transition: all 0.1s ease; border: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .pad:hover { border-color: var(--border-light); }
        .pad.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px var(--accent-glow); }
        .pad.loaded { background: linear-gradient(180deg, #252530 0%, #1e1e26 100%); }
        .pad.playing { background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%); border-color: var(--accent); }
        .pad.playing .pad-name, .pad.playing .pad-info { color: white; }

        .pad-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 2px; }
        .pad-midi-led { width: 6px; height: 6px; border-radius: 2px; background: var(--bg-darkest); border: 1px solid var(--border); }
        .pad.midi-triggered .pad-midi-led, .pad.playing .pad-midi-led { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
        .pad-number { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); font-weight: 500; }
        .pad.playing .pad-number { color: rgba(255,255,255,0.7); }

        .pad-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 6px 2px; }
        .pad-name { font-size: 10px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pad-info { font-size: 8px; color: var(--text-dim); margin-top: 1px; }

        .pad-transport { display: flex; gap: 2px; padding: 3px 6px 4px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.05); }
        .pad-transport-btn {
            flex: 1; height: 16px; border: none; border-radius: 2px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: 600; transition: all 0.1s;
        }
        .pad-transport-btn.play-btn { background: var(--bg-light); color: var(--green); border: 1px solid var(--border); }
        .pad-transport-btn.play-btn:hover { background: var(--green); color: white; }
        .pad-transport-btn.stop-btn { background: var(--bg-light); color: var(--accent); border: 1px solid var(--border); }
        .pad-transport-btn.stop-btn:hover { background: var(--accent); color: white; }
        .pad.playing .pad-transport-btn.play-btn { background: var(--green); color: white; }

        .pad-level { position: absolute; bottom: 24px; left: 0; right: 0; height: 2px; background: var(--bg-darkest); }
        .pad-level-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent) 0%, var(--yellow) 100%); }
        .pad.playing .pad-level-fill { width: 100%; }

        /* Waveform Section */
        .waveform-section { background: var(--bg-mid); border-top: 1px solid var(--border); padding: 10px 16px; }
        .waveform-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .waveform-title { display: flex; align-items: center; gap: 8px; }
        .waveform-pad-indicator { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--bg-darkest); padding: 3px 8px; border-radius: 3px; }
        .waveform-filename { font-size: 12px; color: var(--text-primary); font-weight: 500; }
        .waveform-controls-top { display: flex; align-items: center; gap: 4px; }

        .wf-btn {
            padding: 4px 8px; background: var(--bg-light); border: 1px solid var(--border);
            border-radius: 3px; color: var(--text-secondary); font-size: 9px; font-weight: 500;
            cursor: pointer; transition: all 0.1s; display: flex; align-items: center; gap: 3px;
        }
        .wf-btn:hover { background: var(--bg-lighter); color: var(--text-primary); }
        .wf-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

        .waveform-display { position: relative; height: 90px; background: var(--bg-darkest); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
        .waveform-canvas { width: 100%; height: 100%; }
        .waveform-marker { position: absolute; top: 0; bottom: 0; width: 2px; cursor: ew-resize; z-index: 10; }
        .waveform-marker.start { left: 0; background: var(--green); }
        .waveform-marker.end { right: 0; background: var(--accent); }
        .waveform-region { position: absolute; top: 0; bottom: 0; background: rgba(232, 74, 53, 0.08); pointer-events: none; }
        .waveform-region-inactive { position: absolute; top: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); pointer-events: none; }

        .hitpoint-marker { position: absolute; top: 0; bottom: 0; width: 10px; margin-left: -5px; cursor: ew-resize; z-index: 12; }
        .hitpoint-marker::before { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: var(--yellow); opacity: 0.8; }
        .hitpoint-marker.selected::before { background: var(--purple); box-shadow: 0 0 8px var(--purple); }

        .slice-region { position: absolute; top: 14px; bottom: 14px; background: rgba(156, 95, 255, 0.1); border: 1px solid transparent; cursor: grab; z-index: 5; }
        .slice-region:hover { background: rgba(156, 95, 255, 0.25); border-color: var(--purple); }
        .slice-region.selected { background: rgba(156, 95, 255, 0.3); border-color: var(--purple); }
        .slice-region.midi-active { background: rgba(0, 200, 224, 0.4); border-color: var(--cyan); }
        .slice-midi-badge { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 600; color: var(--cyan); background: var(--bg-darkest); padding: 1px 4px; border-radius: 2px; border: 1px solid var(--cyan-dim); pointer-events: none; }
        .slice-region-label { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); font-size: 7px; font-weight: 600; color: var(--purple); background: rgba(13, 13, 15, 0.9); padding: 1px 4px; border-radius: 2px; white-space: nowrap; pointer-events: none; }

        .waveform-info { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .wf-time-group { display: flex; align-items: center; gap: 10px; }
        .wf-time-item { display: flex; align-items: center; gap: 3px; }
        .wf-time-label { font-size: 8px; color: var(--text-dim); text-transform: uppercase; }
        .wf-time-value { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-secondary); }
        .wf-time-value.start { color: var(--green); }
        .wf-time-value.end { color: var(--accent); }

        .hitpoint-controls { display: flex; align-items: center; gap: 6px; }
        .hit-nav-btn { width: 20px; height: 20px; background: var(--bg-light); border: 1px solid var(--border); border-radius: 3px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; }
        .hit-nav-btn:hover { background: var(--bg-lighter); color: var(--text-primary); }
        .hit-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .hit-counter { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--yellow); min-width: 36px; text-align: center; }

        /* Controls Section */
        .controls-section { background: var(--bg-dark); border-top: 1px solid var(--border); padding: 12px 16px; }
        .controls-tabs { display: flex; gap: 2px; margin-bottom: 12px; background: var(--bg-darkest); padding: 3px; border-radius: 4px; }
        .control-tab { flex: 1; padding: 5px 10px; background: transparent; border: none; border-radius: 3px; color: var(--text-secondary); font-size: 10px; font-weight: 500; cursor: pointer; }
        .control-tab:hover { color: var(--text-primary); }
        .control-tab.active { background: var(--bg-lighter); color: var(--text-bright); }
        .controls-panel { display: none; }
        .controls-panel.active { display: block; }

        .controls-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .control-group-label { font-size: 8px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.3px; }

        .encoder { position: relative; width: 36px; height: 36px; cursor: pointer; }
        .encoder-track { position: absolute; inset: 0; border-radius: 50%; background: var(--bg-darkest); border: 2px solid var(--border); }
        .encoder-knob { position: absolute; inset: 4px; border-radius: 50%; background: linear-gradient(145deg, var(--bg-lighter) 0%, var(--bg-light) 100%); border: 1px solid var(--border-light); }
        .encoder-indicator { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 2px; height: 5px; background: var(--accent); border-radius: 1px; transform-origin: center center; }
        .encoder-value { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-secondary); }

        .divider { width: 1px; height: 60px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

        .toggle-group { display: flex; flex-direction: column; gap: 3px; }
        .toggle-btn {
            padding: 4px 10px; background: var(--bg-light); border: 1px solid var(--border);
            border-radius: 3px; color: var(--text-secondary); font-size: 9px; font-weight: 500; cursor: pointer;
        }
        .toggle-btn:hover { background: var(--bg-lighter); }
        .toggle-btn.active { background: var(--cyan-dim); border-color: var(--cyan); color: white; }

        /* FX Sections */
        .fx-section { background: var(--bg-mid); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
        .fx-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
        .fx-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .fx-section-title.filter { color: var(--accent); }
        .fx-section-title.lfo { color: var(--orange); }
        .fx-section-title.delay { color: var(--cyan); }
        .fx-section-title.reverb { color: var(--purple); }

        .fx-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .fx-group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .fx-label { font-size: 8px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; }

        .lfo-wave-display { width: 50px; height: 24px; background: var(--bg-darkest); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
        .lfo-wave-display canvas { width: 100%; height: 100%; }

        .preset-group { display: flex; flex-direction: column; gap: 2px; }
        .preset-btn { padding: 3px 6px; background: var(--bg-light); border: 1px solid var(--border); border-radius: 2px; color: var(--text-secondary); font-size: 8px; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .preset-btn:hover { background: var(--bg-lighter); color: var(--text-primary); }
        .preset-btn.active { background: var(--cyan-dim); border-color: var(--cyan); color: white; }

        .route-group { display: flex; gap: 3px; }
        .route-btn { padding: 3px 6px; background: var(--bg-darkest); border: 1px solid var(--border); border-radius: 2px; color: var(--text-dim); font-size: 8px; font-weight: 600; cursor: pointer; }
        .route-btn:hover { border-color: var(--border-light); color: var(--text-secondary); }
        .route-btn.active { background: var(--orange); border-color: var(--orange); color: white; }
        .route-btn.lpf.active { background: var(--accent); border-color: var(--accent); }
        .route-btn.hpf.active { background: var(--yellow); border-color: var(--yellow); color: var(--bg-darkest); }

        .wave-select { padding: 3px 6px; background: var(--bg-darkest); border: 1px solid var(--border); border-radius: 2px; color: var(--text-primary); font-size: 9px; cursor: pointer; }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .sampler-container { flex-direction: column; }
            .sampler { border-radius: 8px 8px 0 0; border-right: 1px solid var(--border); border-bottom: none; max-width: 100%; }
            .piano-roll { flex-direction: row; width: 100%; height: 80px; border-radius: 0 0 8px 8px; }
            .piano-roll-keys { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
            .piano-key.white { width: 28px; height: 100%; }
            .piano-key.black { width: 20px; height: 60%; margin-left: -10px; margin-right: -10px; }
        }
    </style>
</head>
<body>
    <div class="sampler-container">
        <div class="sampler">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
                    <span class="logo-text">DOOM SAMPLER</span>
                </div>
                <div class="header-center">
                    <div class="sync-badge" id="sync-badge"><span>SYNC</span></div>
                    <div class="tempo-display"><span id="tempo-value">120.00</span> BPM</div>
                </div>
                <div class="header-right">
                    <div class="midi-status">
                        <div class="midi-dot" id="midi-dot"></div>
                        <span id="midi-status-text">MIDI</span>
                    </div>
                    <div class="pad-counter"><span id="selected-pad-num">1</span>/16</div>
                </div>
            </div>

            <div class="main-content">
                <div class="pad-section">
                    <div class="pad-grid-wrapper">
                        <div class="pad-row-indicators">
                            <div class="row-indicator">A</div>
                            <div class="row-indicator">B</div>
                            <div class="row-indicator">C</div>
                            <div class="row-indicator">D</div>
                        </div>
                        <div class="pad-grid" id="pad-grid"></div>
                    </div>
                </div>

                <div class="waveform-section">
                    <div class="waveform-header">
                        <div class="waveform-title">
                            <span class="waveform-pad-indicator" id="wf-pad-num">1</span>
